<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Krillion — der tägliche Quiz-Tauchgang</title>
  <meta name="description" content="Tauche so tief du kannst — mit seltenen Antworten auf jede Quizfrage. Sieben Fragen am Tag, 40 Sekunden pro Frage.">
  <meta name="theme-color" content="#0a4f7e">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%A6%90%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Fredoka:wght@500;600;700&display=swap">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="ocean" aria-hidden="true">
    <div class="rays"></div>
    <canvas id="snow"></canvas>
  </div>

  <header class="topbar">
    <button class="brand" data-act="brand" aria-label="Krillion Startseite">
      <span class="brand-mark" aria-hidden="true">🦐</span>
      <span class="brand-name">Krillion</span>
    </button>
    <nav class="top-actions" aria-label="Hauptmenü">
      <button class="icon-btn" data-act="log" aria-label="Tauchlogbuch" title="Tauchlogbuch">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
      </button>
      <button class="icon-btn" data-act="help" aria-label="So wird gespielt" title="So wird gespielt">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9.4 9.3a2.7 2.7 0 1 1 3.7 2.5c-.8.3-1.1.9-1.1 1.7v.4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="17" r="1.1" fill="currentColor"/></svg>
      </button>
    </nav>
  </header>

  <main id="app"></main>

  <div id="modal-root"></div>
  <div id="toast" role="status" aria-live="polite"></div>

  <noscript><p class="noscript">Krillion braucht JavaScript zum Tauchen. Bitte aktiviere es — das Wasser ist herrlich.</p></noscript>

  <script src="js/data.js"></script>
  <script src="js/data-more-1.js"></script>
  <script src="js/data-more-2.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
